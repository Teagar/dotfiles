# window border
window.active.border.color: #7b4baf
window.inactive.border.color: #6e9f45

# ToggleKeybinds status indicator
window.active.indicator.toggled-keybind.color: #c75c5c

# window titlebar background
window.active.title.bg.color: #7b4baf
window.inactive.title.bg.color: #6e9f45

window.active.label.text.color: #e6e6e6
window.inactive.label.text.color: #000000
window.label.text.justify: center

# window button hover overlay
window.button.hover.bg.color: #1b1b1b

# window buttons
window.active.button.unpressed.image.color: #e6e6e6
window.inactive.button.unpressed.image.color: #e6e6e6

# menu
menu.border.color: #e6e6e6
menu.items.bg.color: #7b4baf
menu.items.text.color: #e6e6e6
menu.items.active.bg.color: #6e9f45
menu.items.active.text.color: #000000
menu.separator.color: #e6e6e6
menu.title.bg.color: #7b4baf
menu.title.text.color: #e6e6e6

# on screen display (window-cycle dialog)
osd.bg.color: #7b4baf
osd.border.color: #e6e6e6
osd.label.text.color: #e6e6e6
osd.window-switcher.preview.border.color: #5a5a5a
