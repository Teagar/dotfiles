[accessibility]
ui_scale = 0.90000000596046448

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.68
    center = [ "workspaces" ]
    end = [ "privacy", "tray", "widget", "bar", "notifications", "network", "bluetooth", "control-center" ]
    start = [ "battery", "group:g1", "group:g2", "media" ]

        [[bar.default.capsule_group]]
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "clock", "date" ]
        opacity = 0.68
        padding = 6.0
        

        [[bar.default.capsule_group]]
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "cpu", "temp", "ram" ]
        opacity = 0.68
        padding = 6.0

[dock]
active_monitor_only = true
auto_hide = true
cross_axis_padding = 0
enabled = true
icon_size = 20
position = "left"
reserve_space = false
shadow = false
show_instance_count = false

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 213.0
    box_width = 810.0
    cx = 960.0
    cy = 889.5
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_session_buttons = true

[shell]
app_icon_color = "on_surface_variant"

[widget.control-center]
glyph = "navigation-filled"

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"

[widget.media]
hide_when_no_media = true
max_length = 248

[widget.temp]
type = "sysmon"
stat = "cpu_temp"

[widget.tray]
capsule = true

[widget.workspaces]
hide_when_empty = true
max_label_chars = 2
scroll_repeat = "steps"

[battery]
warning_threshold = 0

[notification]
filter_order = ["niri_screenshot"]

[notification.filter.niri_screenshot]
enabled = true
match_content = "Screenshot captured"
show_toast = true
save_history = false
play_sound = false
allow_permanent = false
override_duration = 4000

